name: 问题反馈
description: 报告安装、连接或任务执行中的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。请勿上传 API Key、配对二维码、连接码、设备令牌或私人项目内容。
        安全漏洞请使用仓库 Security 页中的私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: Codex Go 版本
      placeholder: 例如 0.2.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 操作系统版本、设备架构、安装版或 ZIP、连接电脑或本地调用。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始描述，方便维护者重现问题。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误信息、截图或脱敏日志
      description: 安装失败时请保留错误原文；提交前删除敏感信息。
